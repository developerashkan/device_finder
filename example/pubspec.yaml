name: device_finder_example
description: >-
  "Finder" — the device_finder demo app. A simulated room with hubs (no
  Bluetooth needed) feeds the real engine and the 3D radar; Live mode scans
  real BLE devices through device_finder_ble.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.7.0
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  device_finder:
    path: ../
  device_finder_ble: ^0.1.0

dependency_overrides:
  # device_finder_ble depends on device_finder from pub; use this checkout.
  device_finder:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
